name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run tests (stdlib unittest, no third-party deps)
        # The core library and its tests have zero runtime dependencies,
        # so no install step is needed — tests add ./src to sys.path.
        run: python -m unittest discover -s tests -v
